<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisky/Wine Price Checker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <h1 class="header">Whisky/Wine Price Checker</h1>
        <div id="results">
            <p>Enter the bottle information to check prices:</p>
            <input type="text" id="bottleInput" placeholder="Enter bottle name or details">
            <button id="checkPriceBtn">Check Prices</button>
            <div id="priceComparison"></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
